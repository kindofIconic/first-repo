<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; text-align: center; background: #faf6f0; color: #4a4a4a; }
        
        /* Smooth Fade-In Animation */
        .animate { opacity: 0; transform: translateY(20px); animation: fadeIn 1.2s ease forwards; }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        .hero { 
            height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://unsplash.com') center/cover fixed;
            color: white; 
        }
        h1 { font-family: 'Alex Brush', cursive; font-size: 5rem; margin-bottom: 10px; }
        h2 { font-family: 'Alex Brush', cursive; font-size: 3rem; color: #b38b6d; margin-bottom: 15px; }
        section { padding: 60px 20px; max-width: 600px; margin: 0 auto; }
        
        .timer { display: flex; justify-content: center; gap: 15px; margin-top: 20px; font-size: 1.5rem; font-weight: 500; color: #b38b6d; }
        form { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-top: 20px; }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        button { background: #b38b6d; color: white; border: none; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>

    <header class="hero">
        <h1 class="animate">Aria & Ethan</h1>
        <p class="animate" style="animation-delay: 0.3s; letter-spacing: 3px;">ARE GETTING MARRIED</p>
    </header>

    <section class="animate" style="animation-delay: 0.6s;">
        <h2>Our Story</h2>
        <p>Two hearts joining together as one. We invite you to celebrate our love story with us!</p>
    </section>

    <section class="animate" style="animation-delay: 0.9s;">
        <h2>The Countdown</h2>
        <p>October 24, 2027 • New York, NY</p>
        <div class="timer" id="countdown">Loading...</div>
    </section>

    <section class="animate" style="animation-delay: 1.2s;">
        <h2>RSVP</h2>
        <form id="rsvp">
            <input type="text" id="name" placeholder="Your Name" required>
            <select id="status" required>
                <option value="" disabled selected>Will you attend?</option>
                <option value="yes">Joyfully Accept</option>
                <option value="no">Regretfully Decline</option>
            </select>
            <button type="submit">Submit</button>
        </form>
    </section>

    <script>
        // Target Wedding Date
        const targetDate = new Date("Oct 24, 2027 16:00:00").getTime();

        setInterval(() => {
            const now = new Date().getTime();
            const diff = targetDate - now;

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById("countdown").innerHTML = `${d}d : ${h}h : ${m}m : ${s}s`;
        }, 1000);

        // RSVP Handle
        document.getElementById('rsvp').addEventListener('submit', (e) => {
            e.preventDefault();
            alert(`Thank you, ${document.getElementById('name').value}! Your response is saved.`);
            e.target.reset();
        });
    </script>
</body>
</html>
